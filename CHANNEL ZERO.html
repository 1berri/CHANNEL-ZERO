/* cameras */
let KC=0,PH=0,seenPh=0;
function openCam(){show(`<b>SECURITY — CH ${KC+1}</b><br><canvas id="sc" class="sc" width="320" height="180"></canvas><div>`+[0,1,2,3,4].map(i=>`<button onclick="KC=${i};openCam()">CAM ${i+1}</button>`).join("")+`<button onclick="hide()">Close</button></div>`);mode="cam"}
function drawCam(){const c=$("sc");if(!c)return;const x=c.getContext("2d");x.fillStyle="#0c140e";x.fillRect(0,0,320,180);x.fillStyle="#1d2a20";x.fillRect(0,120,320,60);
S.pos.forEach((r,i)=>{if(r==KC){x.fillStyle="#"+MC[i][0].toString(16).padStart(6,"0")+"";x.globalAlpha=.55;x.fillRect(40+i*52,60,26,90);x.beginPath();x.arc(53+i*52,56,16,0,7);x.fill();x.globalAlpha=1}});
if(PH&&PH.k==KC){x.fillStyle="#000";x.fillRect(250,50,30,110);x.beginPath();x.arc(265,46,17,0,7);x.fill();seenPh=1}
for(let i=0;i<300;i++){x.fillStyle=R()<.5?"#fff4":"#8884";x.fillRect(R()*320,R()*180,2,1)}
if(R()<.1){x.fillStyle="#fff3";x.fillRect(0,R()*180,320,6)}
x.fillStyle="#7f7";x.font="11px monospace";x.fillText("CAM "+(KC+1)+" "+RN[KC]+"  REC 03:"+(10+(Date.now()/6e4|0)%50),6,12);if(ng)ng.gain.value=.012}
function camLeft(){if(seenPh&&PH){if(R()<.5){put(0,PH.k)}PH=0;seenPh=0}}
/* VHS */
const V={tp:0,t:0,p:0,r:1,k:.5,s:.5,h:0};
function openVHS(){show(`<b>VHS DECK — ARCHIVE UNIT 2</b><br><canvas id="sc" class="sc" width="320" height="180"></canvas><div id="st"></div><div>TRACKING <input id="tk" type="range" min="0" max="100" value="50"> SIGNAL <input id="sgn" type="range" min="0" max="100" value="50"></div><div><button onclick="V.p=1;V.r=1">PLAY</button><button onclick="V.p=0">PAUSE</button><button onclick="V.p=1;V.r=-5">REW</button><button onclick="V.p=1;V.r=5">FF</button><button onclick="V.tp=0;V.p=0;V.t=0">EJECT</button><button onclick="hide()">CLOSE</button></div><div>INSERT: `+(S.inv.map(n=>`<button onclick="V.tp=${n};V.t=0;V.p=0;V.h=0">TAPE 0${n}</button>`).join("")||"no tapes held")+`</div>`);mode="vhs"}
const fmt=t=>(t/60|0)+":"+String(t%60|0).padStart(2,"0");
function wrap(s,n){const o=[];let l="";s.split(" ").forEach(w=>{if((l+w).length>n){o.push(l);l=""}l+=w+" "});o.push(l);return o}
function vtick(){const c=$("sc");if(!c)return;V.k=$("tk").value/100;V.s=$("sgn").value/100;const x=c.getContext("2d"),tp=T[V.tp];
if(!tp){x.fillStyle="#001";x.fillRect(0,0,320,180);x.fillStyle="#6af";x.font="14px monospace";x.fillText("NO TAPE",125,95);$("st").textContent="Select a tape below.";return}
const q=1-Math.min(1,Math.max(Math.abs(V.k-tp.tr)/.25,Math.abs(V.s-tp.sg)/.3)),cl=Math.abs(V.k-tp.tr)<.08&&Math.abs(V.s-tp.sg)<.1;
if(V.p){V.t+=V.r*.1;if(V.t>=60){V.t=60;V.p=0}if(V.t<=0){V.t=0;V.p=0}}
if(cl&&V.p&&V.r==1&&V.t>=40){V.h+=.1;if(V.h>2.5&&!S.d.includes(V.tp))digit(V.tp)}
x.fillStyle=tp.bg;x.fillRect(0,0,320,128);x.fillStyle=tp.fc;x.beginPath();x.arc(160,66,36,0,7);x.fill();x.fillStyle="#000";x.fillRect(140,78,40,5);
for(let i=0;i<(1-q)*900+40;i++){x.fillStyle=R()<.5?"#fff":"#888";x.fillRect(R()*320,R()*128,2+R()*8,1)}
if(q<1){const y=R()*110;x.drawImage(c,0,y,320,12,(R()-.5)*70*(1-q),y,320,12)}
const sg=Math.min(2,V.t/20|0);let s=tp.L[sg];if(sg==2&&!cl)s=0;
x.fillStyle="#000";x.fillRect(0,128,320,52);x.fillStyle="#fff";x.font="11px monospace";
if(s){if(q<.7)s=s.replace(/[a-z]/gi,ch=>R()<(1-q)?"▒":ch);wrap(s,44).forEach((l,i)=>x.fillText(l,6,142+i*13))}else x.fillText("▒▒▒ NO SIGNAL ▒▒▒",100,150);
x.fillStyle="#f44";x.fillText((V.p?V.r==1?"PLAY":V.r>0?"FF":"REW":"PAUSE")+" "+fmt(V.t),6,12);
$("st").textContent="TAPE 0"+V.tp+(S.d.includes(V.tp)?" [DIGITIZED]":"")+" | clarity "+(q*100|0)+"%";if(ng)ng.gain.value=.05*(1-q)+.01}
function digit(n){S.d.push(n);save();vis();sub("TAPE 0"+n+" DIGITIZED. "+(n<5?"The facility shifts. Night "+night()+" begins.":n==5?"Something in the Control Room is powering up.":"The master recording is saved."));burst(.8,.3,1500)}
/* broadcast */
const U={a:.5,b:.5,c:0};
function openTune(){if(!S.d.includes(5)){sub("No source signal. The panel wants the final tape digitized first.");return}if(S.end){sub("The panel is dead.");return}
show(`<b>BROADCAST RESTORE</b><br><canvas id="sc" class="sc" width="320" height="120"></canvas><div>CARRIER <input id="ta" type="range" min="0" max="100" value="50"> PHASE <input id="tb" type="range" min="0" max="100" value="50"></div><div id="st"></div><button onclick="hide()">Abort</button>`);U.c=0;mode="tune"}
function ttick(){const c=$("sc");if(!c)return;const a=$("ta").value/100,b=$("tb").value/100;if(R()<.05){U.a=Math.min(.9,Math.max(.1,U.a+(R()-.5)*.5));U.b=Math.min(.9,Math.max(.1,U.b+(R()-.5)*.5))}
const d=Math.max(Math.abs(a-U.a),Math.abs(b-U.b)),ok=d<.07;U.c=ok?U.c+.1:Math.max(0,U.c-.06);const x=c.getContext("2d");x.fillStyle="#010";x.fillRect(0,0,320,120);
for(let i=0;i<600*Math.min(1,d*3);i++){x.fillStyle=R()<.5?"#fff":"#6c6";x.fillRect(R()*320,R()*120,3,1)}x.fillStyle="#9fe8a8";x.fillRect(0,100,320*U.c/8,8);
$("st").textContent=ok?"Signal locking... interference at "+(d*100|0)+"%":"The signal drifts. Chase it.";if(ng)ng.gain.value=.05*Math.min(1,d*3);if(U.c>=8)ending()}
function ending(){const hid=S.sec.length>=3&&S.d.includes(6);S.end=hid?2:1;save();mode=0;if(ng)ng.gain.value=0;
show(hid?`<b>THE DOOR THAT WATCHES BACK</b><p>The broadcast holds. On every monitor the Wing C door opens by itself, and the footage turns to face you. Sunny, Marlow, Pip, Ruby and Mr. Weller sit in the empty audience, waiting for the episode to start. Someone has logged you on the staff directory. Employee 00. Start date: 1982.</p><p>The tape in the deck is labeled with tomorrow's date.</p><p><i>HIDDEN ENDING. CHANNEL ZERO will return.</i></p><button onclick="hide()">Keep exploring</button>`:`<b>BROADCAST RESTORED</b><p>For eleven minutes the station is quiet. The corrupted signal resolves, the monitors settle, and the archive is saved to the company server. You clock out at 03:12. In the lot, every window of the building is lit.</p><p>The inventory shows TAPE 07, labeled tonight's date. You did not record it.</p><p><i>STANDARD ENDING. Not everything was found. Look closer.</i></p><button onclick="hide()">Keep exploring</button>`)}
/* director */
let cd=25,lastE=-1;
function other(){let r;do{r=5*R()|0}while(r==P.room);return r}
const EV=[()=>put(5*R()|0,other()),
()=>{if(P.room==0&&!ap){put(0,0,P.x>0?1:0);ms[0].position.set(P.x>0?-12.5:12.5,0,0);ms[0].lookAt(P.x,0,P.z);ap={u:performance.now()+4500};jingle(0)}},
()=>{$("fl").style.opacity=.3;setTimeout(()=>$("fl").style.opacity=0,250);burst(.8,.25,3000);sub("[A CRT clicks on somewhere in the building.]")},
()=>{const o=D.filter(d=>d.open&&Math.hypot(d.x-P.x,d.z-P.z)>3);if(o.length){setDoor(o[R()*o.length|0],0);sub("[A door closes.]")}},
()=>{const p=R()<.5?-1:1;if(R()<.5){jingle(p);sub("[Distant music. The Happy Neighborhood theme, slowed.]")}else{burst(1.5,.08,900,p);sub("[A quiet voice under the static: technician.]")}},
()=>{PH={k:1+(4*R()|0)};seenPh=0;sub("[Static ripples through the security feeds.]")},
()=>{fk={u:performance.now()+2500,i:P.room};burst(.5,.1,200)}];
setInterval(()=>{if(ui||!started)return;if(--cd>0)return;cd=Math.max(7,(12+R()*25)/(1+night()*.12))|0;let k;do{k=EV.length*R()|0}while(k==lastE);lastE=k;EV[k]();},1000);
setInterval(()=>{if(mode=="vhs")vtick();else if(mode=="cam")drawCam();else if(mode=="tune")ttick()},100);
setInterval(()=>{if(started)save()},20000);
/* input */
const cv=$("cv");
function begin(){au();if(AC.resume)AC.resume();started=1;hide();vis();S.pos.forEach((r,i)=>put(i,r));try{cv.requestPointerLock()}catch(e){}sub("Archive technician, night shift. WASD move, E interact, P pause.")}
function menu(){const fresh=!started;show(`<b style="font-size:20px">${fresh?"CHANNEL ZERO":"PAUSED"}</b><p>${fresh?"Morrow Broadcasting Station, 2025. Digitize the archive. Do not trust the dates.<br>WASD move · Shift sprint · C crouch · E interact · P pause · Esc closes screens":"Autosaves every 20 seconds."}</p>
<div>Mouse sensitivity <input type="range" min="1" max="8" value="${set.sens*1000}" oninput="set.sens=this.value/1000"></div>
<div>Brightness <input type="range" min="50" max="160" value="${set.br*100}" oninput="set.br=this.value/100;cv.style.filter='brightness('+set.br+')'"></div>
<div>Volume <input type="range" min="0" max="100" value="${set.vol*100}" oninput="set.vol=this.value/100;if(AC)AC.mst.gain.value=set.vol"></div>
<div><label><input type="checkbox" ${set.sub?"checked":""} onchange="set.sub=this.checked?1:0"> Subtitles</label></div>
<button onclick="begin()">${fresh?(S.d.length||S.inv.length?"CONTINUE":"BEGIN"):"RESUME"}</button><button onclick="save();sub('Saved.')">SAVE</button><button onclick="if(confirm('Erase save?')){localStorage.removeItem('cz0');location.reload()}">NEW GAME</button>`)}
addEventListener("keydown",e=>{if(e.target.tagName=="INPUT"&&e.target.type=="text")return;K[e.code]=1;if(!started)return;
if(e.code=="KeyE"&&!ui&&cur)cur.f();else if(e.code=="Escape"&&ui)hide();else if(e.code=="KeyP"&&!ui)menu()});
addEventListener("keyup",e=>K[e.code]=0);
cv.addEventListener("mousedown",()=>{drag=1;if(started&&!ui)try{cv.requestPointerLock()}catch(e){}});addEventListener("mouseup",()=>drag=0);
addEventListener("mousemove",e=>{if(ui||!started)return;if(document.pointerLockElement==cv||drag){P.yaw-=e.movementX*set.sens;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-e.movementY*set.sens))}});
document.addEventListener("pointerlockchange",()=>{if(started&&!ui&&!document.pointerLockElement&&!drag)menu()});
vis();menu();loop();
</script></body></html>
